run:
  seed: 42
  device: cuda
  max_outer_iters: 30

airfoil:
  lr: 0.01
  upper_initial_weights: [0.18109497, 0.21268419, 0.28098503, 0.24864887, 0.2402814, 0.27262843, 0.25776474, 0.27817638]
  lower_initial_weights: [-0.16965146, -0.09364138, -0.06345896, -0.0067966, -0.0902447,  0.02081845, -0.03575216, -0.00223623]
  leading_edge_weight: 0.10647
  TE_thickness: 0.00257
io:
  gif_fps: 10
  log_every: 1
  checkpoint_dir: ./runs/perching3D
  wandb:
    enabled: true
    project: "glider-optimization"
    tags: ["Perching3D"]
    notes: "Perching with spanwise (lifting-line) wing model"


neuralFoilSampling:
  AoA_min: -30
  AoA_max: 30
  Re_min: 100
  Re_max: 100000
  n_samples: 1024
  neuralFoil_size: xxxlarge
  rho: 10.0
  min_confidence: 0.6
  min_avg_Cl_Cd: 1.0
  use_3d_llt: true
  llt_beta: 0.4
  llt_tol: 1e-3
  llt_max_iter: 60

reducedModel:
  chebyshev_degree: 25
  l2_reg: 0

ocp:
  initial_states: [[-11.0, 1 , 0. , 0., 6.0, 3.0 , 0., 0.01], [-11.0, 0 , 0. , 0., 6.0, 3.0 , 0., 0.01], [-10, 1 , 0. , 0., 6.0, 3.0 , 0., 0.01], [-10, 0 , 0. , 0., 6.0, 3.0 , 0., 0.01]]
  stage_control_weight: 0.3

evaluation:
  mode: Perching

plane:
  wing:
    # Tapered wing (taper ratio 0.6, same as before) sized so the LLT-derived S_w/chord
    # (0.158/0.06) exactly match glider_jinenv.py's 2D fallback constants -- isolates the
    # 2D-vs-3D comparison to the aerodynamic model itself, not an accidental wing-scale
    # mismatch. Solved numerically through the real 7-station pipeline (not a closed-form
    # approximation): S_w=0.158000, chord=0.060000 to 6 decimal places.
    y_half: [0, 1.345621]
    c_half: [0.073386, 0.044032]
    xle_half: [0, 0]
    twist_half: [0, 0]
    dihedral: 0.0
    dynamic_centroid: false
