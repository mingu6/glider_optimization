[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glider-optimization"
version = "1.0.0"
description = "Gradient-based nested co-design of aerodynamic shape and control for winged robots using NeuralFoil and lifting-line coupling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "pydantic>=2.12",
  "numpy>=1.26",
  "torch>=2.2",
  "typing-extensions>=4.15",
  "wandb>=0.24",
  "aerosandbox >= 4.2",
  "matplotlib>=3.8",
  "imageio>=2.37",
  "neuralfoil>=0.3",
  "casadi>=3.6",
  "plotly>=6.0",
  "pandas>=2.2",
  "trimesh>=4.11",
  "pyglet<2"
]

[project.scripts]
glider-opt = "glider_optimization.main:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "black>=24.0",
]

[project.urls]
Repository = "https://github.com/<your-user>/<your-repo>"

[tool.setuptools.packages.find]
where = ["."]
include = ["glider_optimization*"]
namespaces = true